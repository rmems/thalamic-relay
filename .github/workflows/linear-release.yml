name: Linear Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-release:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A scheduled pipeline needs an explicit version so this updates the
      # existing v0.2.0 release instead of selecting another planned release.
      - name: Sync v0.2.0 commits and issues to Linear
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: v0.2.0

      - name: Complete v0.2.0 in Linear
        if: github.event_name == 'release'
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: v0.2.0
