[package]
name = "thalamic-relay"
version = "0.1.0"
edition = "2024"
description = "Typed hardware telemetry and deterministic safety library, plus the thalamic-relay supervisor binary (software-only, no built-in FPGA bridge)."
repository = "https://github.com/rmems/thalamic-relay"
license = "MIT OR Apache-2.0"
rust-version = "1.98.1"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Core Logic
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
lazy_static = "1.4"


# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Hardware Interfaces
nvml-wrapper = "0.10"

[[bin]]
name = "thalamic-relay"
path = "src/main.rs"

[workspace]
